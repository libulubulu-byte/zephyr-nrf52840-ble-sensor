# =============================================================================
#  BLE Environmental Sensor Node - application configuration
#  nRF Connect SDK v2.7.0 (Zephyr 3.6.99-ncs2), board: nrf52840_supermini
#
#  NOTE: Kconfig does not support trailing comments on a value line - a
#  "# ..." after "=y" becomes part of the value and the assignment is
#  rejected. Comments therefore go on their own line.
# =============================================================================

# -----------------------------------------------------------------------------
#  Logging - the console is routed to USB CDC ACM (no UART bridge on the board)
# -----------------------------------------------------------------------------
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=1024

CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_LOG_BACKEND_UART=y

CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y

# Same identifiers the board uses in application mode, so the host keeps
# treating it as the same device across a reflash.
CONFIG_USB_DEVICE_VID=0x239A
CONFIG_USB_DEVICE_PID=0x8029
CONFIG_USB_DEVICE_MANUFACTURER="EnvNode"
CONFIG_USB_DEVICE_PRODUCT="Env Sensor Node"

# -----------------------------------------------------------------------------
#  Bluetooth LE peripheral
# -----------------------------------------------------------------------------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="EnvNode"
CONFIG_BT_DEVICE_NAME_DYNAMIC=n
CONFIG_BT_MAX_CONN=1

# Appearance 0x0541 = "Sensor". Zephyr expresses the 16-bit assigned number
# in decimal in Kconfig.
CONFIG_BT_DEVICE_APPEARANCE=1345

# Built-in (open source) link layer. On a full NCS install the Nordic
# SoftDevice Controller is the alternative: add the sdk-nrfxlib module and
# swap this pair for CONFIG_BT_LL_SOFTDEVICE=y, which trades flash for a
# slightly better radio power profile.
CONFIG_BT_CTLR=y
CONFIG_BT_LL_SW_SPLIT=y

# No pairing: the service is read/notify only. Enabling LE Secure Connections
# is CONFIG_BT_SMP=y plus BT_GATT_PERM_*_ENCRYPT on the characteristic
# permissions in env_service.c.
CONFIG_BT_SMP=n
CONFIG_BT_PRIVACY=n
CONFIG_BT_GATT_DYNAMIC_DB=n
CONFIG_BT_GATT_NOTIFY_MULTIPLE=n
CONFIG_BT_EXT_ADV=n

# Requested connection parameters: 100 ms interval, no latency, 4 s
# supervision. Zephyr expresses the interval in 1.25 ms units, so 80 == 100 ms.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=80
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=80
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

CONFIG_BT_BUF_ACL_TX_COUNT=4
CONFIG_BT_BUF_ACL_RX_COUNT=4

# -----------------------------------------------------------------------------
#  Declared 32.768 kHz accuracy
#
# This is a radio power setting, not a clock formality, and the default is a
# pessimistic one.
#
# The controller has to open each radio window early enough to cover the
# frequency error of both ends, and the width it uses is derived from this
# number. A looser accuracy means wider windows, which means more time with the
# radio and the HFXO powered, which means more average current - on every
# advertising event, for the whole life of the product.
#
# Zephyr's default for a crystal source is CLOCK_CONTROL_NRF_K32SRC_50PPM
# ("31 ppm to 50 ppm"). A common 32.768 kHz tuning-fork crystal is specified at
# +/-20 ppm, and the driver offers that as its own choice, so the default can be
# several times looser than the hardware warrants. On a node whose entire budget
# is 50 uA, that is worth correcting.
#
# Where the number comes from, and the honest limits of it: a board measured
# 65 uA before its first connection and 51 uA afterwards, with nothing in the
# application changing between the two - on_disconnected() restores the same
# sampling cadence and restarts advertising on the same interval. What does
# change across a first connection is what the controller knows: before it, the
# only drift figure available is this declared one; after it, the peer has been
# measured. The 14 uA is consistent with the windows narrowing once the drift is
# no longer a guess.
#
# That is a hypothesis, not a measurement, so it is set up to be tested rather
# than asserted. The test is one line and needs no connection:
#
#     flash this build and measure WITHOUT connecting. If the cold figure
#     moves toward 51 uA, the declared accuracy was the limiter. If it does
#     not move, the difference is elsewhere and this line is still correct
#     for the hardware - just not the explanation.
#
# 30 ppm is the conservative first step: a real narrowing from 50, without
# claiming more than most crystals deliver. If it helps, try 20 ppm.
#
# DIAGNOSTIC FOR BACKING IT OFF: too-tight a declaration is not free. It makes
# the windows too narrow, which shows up as dropped packets and, eventually, a
# link that will not stay up. If connections start failing or disconnect with a
# supervision timeout (reason 0x08) or fail to establish (0x3E), go back to 50.
# The crystal's actual specification is the correct value, and a datasheet beats
# either guess.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_30PPM=y

# -----------------------------------------------------------------------------
#  Sensors
# -----------------------------------------------------------------------------
CONFIG_SENSOR=y
CONFIG_SHT3XD=y
CONFIG_I2C=y
CONFIG_ADC=y

# Single-shot, not periodic. This is the difference between an SHT3x that costs
# 0.3 uA and one that costs about 9 uA, and the driver's default is the expensive
# one.
#
# The choice is a Zephyr Kconfig 'choice' inside the driver, and its default is
# CONFIG_SHT3XD_PERIODIC_MODE: sht3xd_init() writes the periodic-measurement
# command at boot and the part then measures for ever, whether or not anything
# reads it. With CONFIG_SHT3XD_MPS_1 that is one measurement per second, and a
# periodic conversion at high repeatability draws about 600 uA for about 15 ms:
#
#     600 uA x 15 ms = 9 uAs per second  ->  ~9 uA average, continuously
#
# This application reads the sensor once per 30 s. Paying 9 uA to take 30
# measurements and use one is the kind of waste that never shows up as a bug,
# only as a standby current that will not come down. It is worth a mention in
# this file because nothing in the application source would ever have revealed
# it.
#
# In single-shot mode the conversion is started by sensor_sample_fetch() and the
# part returns to its idle state (about 0.2 uA) afterwards:
#
#     one conversion per 30 s  ->  ~0.3 uA average
#
# The cost is that sensor_sample_fetch() blocks for the measurement - 15 ms at
# high repeatability. The sampler runs from a work queue on a 30 s cadence, so
# blocking for 15 ms of that is free.
#
# There is a bonus beyond the current: a single-shot reading is taken when it is
# asked for, rather than being up to a second old by the time it is collected.
CONFIG_SHT3XD_SINGLE_SHOT_MODE=y

# -----------------------------------------------------------------------------
#  Power management
#    connected    : System ON, MCU running, 2 s notify cadence
#    disconnected : System ON Idle, RTC running, 30 s sampling cadence
#
#  Note that CONFIG_PM / CONFIG_PM_DEVICE are deliberately absent, and that
#  is a platform fact rather than an omission.
#
#  Once every thread is blocked the idle thread executes WFE and the nRF52840
#  drops into System ON Idle with the RTC and RAM alive - no configuration
#  required. CONFIG_TICKLESS_KERNEL is what makes that state worth anything:
#  without it the kernel would wake on every tick instead of sleeping all the
#  way until the next scheduled sample.
#
#  CONFIG_PM / CONFIG_PM_DEVICE / CONFIG_PM_DEVICE_RUNTIME all depend on
#  HAS_PM, and no Nordic SoC selects HAS_PM in Zephyr 3.6.99. Verified in
#  both this tree and upstream v3.7.0: soc/nordic/nrf52/Kconfig selects
#  HAS_POWEROFF but never HAS_PM, and nothing under soc/nordic implements
#  pm_state_set(). nRF52 has no intermediate SoC power states to program, so
#  there is nothing for the subsystem to manage - setting CONFIG_PM=y here
#  would silently resolve to n.
#
#  The deep-sleep primitive that *is* modelled for this SoC is System OFF:
#
#    CONFIG_POWEROFF=y     -> pm_system_off(), needs a GPIO to wake it up
#
#  The SuperMini has no user button, so there is no wake source and System
#  OFF is left unused. See README section 5.
# -----------------------------------------------------------------------------
CONFIG_TICKLESS_KERNEL=y

# -----------------------------------------------------------------------------
#  Kernel sizing
# -----------------------------------------------------------------------------
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1536
CONFIG_HEAP_MEM_POOL_SIZE=0
CONFIG_ASSERT=y

# -----------------------------------------------------------------------------
#  Firmware output: Adafruit UF2 for the nice!nano / SuperMini bootloader
# -----------------------------------------------------------------------------
CONFIG_BUILD_OUTPUT_UF2=y

# sys_reboot() is what bootloader.c uses to hand the machine over to the
# bootloader (it writes the DFU magic into NRF_POWER->GPREGRET first, so the
# reset lands straight in UF2 mode). The Kconfig guard hides it by default.
CONFIG_REBOOT=y

# =============================================================================
#  MCUboot OTA - NOT ENABLED ON THIS BOARD
#
#  The SuperMini ships with the Adafruit UF2 bootloader (USB MSC drag & drop,
#  UF2 volume label "NICENANO", USB 239A:00B3). That bootloader owns
#  0x000F4000-0x00100000 and reserves 0x00000-0x26000 for the MBR plus
#  SoftDevice S140, so there is no free region for a second MCUboot slot, and
#  MCUboot itself cannot be installed without an SWD probe.
#
#  To build this exact application with MCUboot on an nRF52840 DK (on-board
#  J-Link), swap the board target and uncomment the block below:
#
#    west build -b nrf52840dk/nrf52840 --sysbuild zephyr/
#
#  CONFIG_BOOTLOADER_MCUBOOT=y
#  CONFIG_MCUBOOT_SIGNATURE_KEY_FILE="mcuboot_private.pem"
#  CONFIG_MCUBOOT_IMAGE_VERSION="1.0.0"
#
#  Then flash the bootloader once over SWD and everything afterwards over BLE:
#    west flash --erase
#    mcumgr --conntype ble --connstring peer_name=EnvNode image upload zephyr.signed.bin
#
#  The application code in src/ is identical on both targets - only the
#  partition layout and the bootloader differ.
# =============================================================================
