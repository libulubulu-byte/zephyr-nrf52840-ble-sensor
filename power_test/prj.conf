# =============================================================================
#  Bare-board current probe - configuration
#
#  The point of this build is to have *nothing* switched on, so almost every
#  subsystem is turned off explicitly rather than left at its default. The
#  defaults matter: CONFIG_BT pulls in the controller and its timers, and
#  CONFIG_SERIAL plus the USB stack light up the nRF52840's USB peripheral,
#  which alone costs hundreds of microamps.
#
#  There is no console here on purpose. Feedback is the LED.
# =============================================================================

# --- everything that could draw current, off ---------------------------------
CONFIG_BT=n
CONFIG_LOG=n
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_USB_DEVICE_STACK=n
CONFIG_SENSOR=n
CONFIG_I2C=n
CONFIG_ADC=n
CONFIG_SPI=n
CONFIG_WATCHDOG=n
CONFIG_FLASH=n
CONFIG_ENTROPY_GENERATOR=n
CONFIG_REBOOT=n

# --- what is left ------------------------------------------------------------
# GPIO, for the LED marker only.
CONFIG_GPIO=y

# The kernel still needs a timebase for the timed part of the sequence; the
# tickless kernel parks on the RTC between events instead of waking every tick.
CONFIG_TICKLESS_KERNEL=y

CONFIG_MAIN_STACK_SIZE=1024
CONFIG_ASSERT=n

# Same flash layout and UF2 output as the product build, so the same
# bootloader and the same flashing procedure apply.
CONFIG_BUILD_OUTPUT_UF2=y
